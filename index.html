<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mini-Metrópolis</title>

  <script async src="https://unpkg.com/es-module-shims@1.6.3/dist/es-module-shims.js"></script>

  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@v0.155.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.155.0/examples/jsm/"
    }
  }
  </script>

  <style>
    .vista {
      display: none;
    }

    .vista.activa {
      display: block;
    }
  </style>
</head>

<body>
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

  <!-- MENÚ INICIAL -->
  <section id="vista-menu" class="vista activa">
    <h1>Mini-Metrópolis</h1>
    <button data-vista="vista-juego">Jugar</button>
    <button data-vista="vista-configuraciones">Configuraciones</button>
    <button data-vista="vista-puntuaciones">Puntuaciones</button>
  </section>

  <!-- PANTALLA DE JUEGO -->
  <section id="vista-juego" class="vista">
    <button data-vista="vista-pausa">Pausa</button>
  </section>

  <!-- MENÚ DE PAUSA -->
  <section id="vista-pausa" class="vista">
    <h2>Pausa</h2>
    <button data-vista="vista-juego">Reanudar</button>
    <button data-vista="vista-menu">Salir</button>
  </section>

  <!-- CONFIGURACIONES -->
  <section id="vista-configuraciones" class="vista">
    <h2>Configuraciones</h2>
    <label>Volumen: <input type="range" id="cfg-volumen" min="0" max="100"></label>
    <label>Sonido: <input type="checkbox" id="cfg-sonido"></label>
    <label>Dificultad:
      <select id="cfg-dificultad">
        <option value="facil">Fácil</option>
        <option value="normal">Normal</option>
        <option value="dificil">Difícil</option>
      </select>
    </label>
    <br><br>
    <button data-vista="vista-menu">Volver</button>
  </section>

  <!-- PUNTUACIONES -->
  <section id="vista-puntuaciones" class="vista">
    <h2>Puntuaciones</h2>
    <table id="tabla-puntuaciones" border="1">
      <thead>
        <tr>
          <th>Nombre</th>
          <th>Puntos</th>
        </tr>
      </thead>
      <tbody>
        <tr><td>Pendiente de API</td><td>-</td></tr>
      </tbody>
    </table>
    <br>
    <button data-vista="vista-menu">Volver</button>
  </section>

  <script src="logica.js"></script>

  <script type="module">

    import * as THREE from 'three';

    var rotarY = 10.0;

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);

    const renderer = new THREE.WebGLRenderer();
    renderer.setSize(window.innerWidth, window.innerHeight);

    const contenedorJuego = document.getElementById('vista-juego');
    contenedorJuego.appendChild(renderer.domElement);

    const geometry = new THREE.BoxGeometry(1, 1, 1);
    const material = new THREE.MeshBasicMaterial({ color: 0x00ff00 });
    const cube = new THREE.Mesh(geometry, material);

    scene.add(cube)

    const esferaGeo = new THREE.SphereGeometry(0.6, 32, 32);
    const esferaMat = new THREE.MeshBasicMaterial({ color: 0x0000ff });
    const esfera = new THREE.Mesh(esferaGeo, esferaMat);
    esfera.position.set(2.5, 0.2, -1);
    scene.add(esfera);

    const cilindroGeo = new THREE.CylinderGeometry(0.5, 0.5, 1, 32);
    const cilindroMat = new THREE.MeshBasicMaterial({ color: 0xff0000 });
    const cilindro = new THREE.Mesh(cilindroGeo, cilindroMat);
    cilindro.position.set(-2.5, 0.2, -1);
    scene.add(cilindro);

    camera.position.z = 8;
    //camera.position.x = -2;
    camera.position.y = 2.5;

    var posicionCubo = new THREE.Vector3(0, 0.2, -1);

    renderer.setAnimationLoop(animate);

    function animate() {

      renderer.render(scene, camera);

    }


    document.addEventListener('keydown', (event) => {

      if (event.key === 'a') {
        cube.position.x -= 1;
      }
      if (event.key === 'd') {
        cube.position.x += 1;
      }
      if (event.key === 'w') {
        cube.position.z -= 1;
      }
      if (event.key === 's') {
        cube.position.z += 1;
      }

    });


  </script>
</body>

</html>
