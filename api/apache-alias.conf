# Expone la carpeta api/ del repositorio en http://localhost/api
#
# XAMPP: agrega estas líneas al final de:
#   C:\xampp\apache\conf\extra\httpd-vhosts.conf
# y reinicia Apache desde el panel de control de XAMPP.
#
# Ajusta la ruta si clonaste el proyecto en otro directorio.

Alias /api "C:/Users/sejei/OneDrive/Escritorio/gcw52/gcw52/api"

<Directory "C:/Users/sejei/OneDrive/Escritorio/gcw52/gcw52/api">
    Options -Indexes
    AllowOverride None
    Require local
</Directory>
