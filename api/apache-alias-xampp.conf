# Expone la carpeta api/ del repositorio en http://localhost/api usando XAMPP.
#
# Copia este archivo en:  C:\xampp\apache\conf\extra\gcw-api.conf
# y agrega en C:\xampp\apache\conf\httpd.conf:
#   Include "conf/extra/gcw-api.conf"
#
# Despues reinicia Apache desde el Panel de Control de XAMPP.
# Ajusta la ruta si clonaste el proyecto en otro directorio.

Alias /api "C:/Users/sejei/OneDrive/Escritorio/gcw52/gcw52/api"

<Directory "C:/Users/sejei/OneDrive/Escritorio/gcw52/gcw52/api">
    Options -Indexes
    AllowOverride None
    Require local
</Directory>
